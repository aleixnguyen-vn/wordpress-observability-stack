services:
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: crawler-node
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    ports:
      - "0.0.0.0:9100:9100"
    networks:
      - crawler_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: crawler-containers
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "0.0.0.0:8080:8080"
    networks:
      - crawler_net

  promtail:
    image: grafana/promtail:3.3.2
    container_name: crawler-logs
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - crawler_net

networks:
  crawler_net:
    driver: bridge